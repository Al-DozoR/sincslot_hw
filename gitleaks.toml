title = "SincSlot secret detection policy"

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "secret"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)["'\s:=]+[A-Za-z0-9_\-]{20,}["']?'''
tags = ["generic", "secret"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["crypto", "secret"]

[[rules]]
id = "password-in-code"
description = "Hardcoded password assignment"
regex = '''(?i)(password|passwd|pwd|secret|token)\s*[:=]\s*["'][^"']{4,}["']'''
tags = ["password", "secret"]

[allowlist]
description = "Ignore known demo token pattern in documentation"
regexes = [
  '''cafebabe:deadbeef''',
  '''BUNDLE_ENTERPRISE__CONTRIBSYS__COM''',
  '''CHANGEME_[A-Z_]+''',
]
paths = [
  '''README\.md''',
  '''Practice207/.+''',
]
