services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "10004:10004"
    depends_on:
      - syncslot_db
      - syncslot_db_test
    volumes:
      - ./storage:/app/backend/storage
      - ./monitoring/runtime-logs/backend:/app/logs
    environment:
      SYNC_SLOT__DB__URL: postgresql+asyncpg://pguser:pgpassword@syncslot_db:5432/syncslot_db
      APP_LOG_FILE: /app/logs/app.log
    networks:
      - syncslot_network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - syncslot_network
    environment:
      VITE_API_URL: "http://backend:10004"

  syncslot_db:
    image: postgres:17.1
    container_name: "syncslot_db"
    hostname: 'syncslot_db'
    volumes:
      - syncslot_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_DB: syncslot_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    networks:
      - syncslot_network

  syncslot_db_test:
    image: postgres:17.1
    container_name: "syncslot_db_test"
    hostname: 'db_test'
    restart: always
    environment:
      POSTGRES_DB: syncslot_db_test
      POSTGRES_USER: pguser_test
      POSTGRES_PASSWORD: pgpassword_test
    ports:
      - "54349:5432"
    networks:
      - syncslot_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://pguser:pgpassword@syncslot_db:5432/syncslot_db?sslmode=disable
    depends_on:
      - syncslot_db
    ports:
      - "9187:9187"
    networks:
      - syncslot_network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - alertmanager
      - node-exporter
      - postgres-exporter
    networks:
      - syncslot_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - syncslot_network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - syncslot_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ./monitoring/runtime-logs:/var/log/sincslot:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - syncslot_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - syncslot_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - syncslot_network
    restart: unless-stopped

volumes:
  syncslot_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  syncslot_network:
    driver: bridge
