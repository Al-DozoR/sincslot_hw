name: SincSlot Security Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  IMAGE_NAME: sincslot-backend-security
  TRIVY_IMAGE: aquasec/trivy:0.65.0

jobs:
  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit
        id: bandit_medium
        continue-on-error: true
        run: |
          mkdir -p artifacts
          bandit -q -ll \
            -r backend/api backend/core backend/di_container backend/entity backend/logger backend/observability backend/repository backend/use_case \
            -f json -o artifacts/bandit-report.json

      - name: Block on High SAST findings
        run: |
          bandit -q -lll \
            -r backend/api backend/core backend/di_container backend/entity backend/logger backend/observability backend/repository backend/use_case

      - name: Add warning summary for Medium findings
        if: steps.bandit_medium.outcome == 'failure'
        run: echo "Bandit found MEDIUM severity issues. Pipeline continues, but remediation is required." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: artifacts/bandit-report.json

  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Block on Critical SCA findings
        id: trivy_fs_critical
        continue-on-error: true
        run: >
          docker run --rm
          -v "${PWD}:/workdir"
          -w /workdir
          ${{ env.TRIVY_IMAGE }}
          fs .
          --scanners vuln
          --vuln-type library
          --severity CRITICAL
          --exit-code 1
          --skip-version-check
          --format table
          --output trivy-fs-critical.txt

      - name: Warn on High SCA findings
        id: trivy_fs_high
        continue-on-error: true
        run: >
          docker run --rm
          -v "${PWD}:/workdir"
          -w /workdir
          ${{ env.TRIVY_IMAGE }}
          fs .
          --scanners vuln
          --vuln-type library
          --severity HIGH
          --exit-code 1
          --skip-version-check
          --format table
          --output trivy-fs-high.txt

      - name: Save SCA JSON report
        run: >
          docker run --rm
          -v "${PWD}:/workdir"
          -w /workdir
          ${{ env.TRIVY_IMAGE }}
          fs .
          --scanners vuln
          --vuln-type library
          --severity CRITICAL,HIGH,MEDIUM,LOW
          --skip-version-check
          --format json
          --output artifacts/trivy-fs-report.json

      - name: Add warning summary for High findings
        if: steps.trivy_fs_high.outcome == 'failure'
        run: echo "Trivy found HIGH dependency vulnerabilities. Pipeline continues, but remediation is required." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Critical SCA findings
        if: steps.trivy_fs_critical.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL dependency vulnerabilities."
          cat trivy-fs-critical.txt
          exit 1

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: artifacts/trivy-fs-report.json

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: gitleaks.toml
          report-path: artifacts/gitleaks-report.json
          verbose: true

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Block on Critical and High image findings
        id: trivy_image_gate
        continue-on-error: true
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${PWD}:/workdir"
          -w /workdir
          ${{ env.TRIVY_IMAGE }}
          image ${{ env.IMAGE_NAME }}:${{ github.sha }}
          --scanners vuln
          --severity CRITICAL,HIGH
          --exit-code 1
          --skip-version-check
          --format table
          --output trivy-image-report.txt

      - name: Save image JSON report
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${PWD}:/workdir"
          -w /workdir
          ${{ env.TRIVY_IMAGE }}
          image ${{ env.IMAGE_NAME }}:${{ github.sha }}
          --scanners vuln
          --severity CRITICAL,HIGH,MEDIUM,LOW
          --skip-version-check
          --format json
          --output artifacts/trivy-image-report.json

      - name: Fail on Critical and High image findings
        if: steps.trivy_image_gate.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL/HIGH vulnerabilities in the backend image."
          cat trivy-image-report.txt
          exit 1

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: artifacts/trivy-image-report.json

  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom.json

  security-gate:
    runs-on: ubuntu-latest
    needs:
      - sast-bandit
      - sca-scan
      - secret-detection
      - image-scan
      - sbom-generation
    steps:
      - name: Check security quality gates
        run: |
          if [ "${{ needs.sast-bandit.result }}" != "success" ] || \
             [ "${{ needs.sca-scan.result }}" != "success" ] || \
             [ "${{ needs.secret-detection.result }}" != "success" ] || \
             [ "${{ needs.image-scan.result }}" != "success" ] || \
             [ "${{ needs.sbom-generation.result }}" != "success" ]; then
            echo "Security quality gate failed."
            exit 1
          fi
          echo "Security quality gate passed."
