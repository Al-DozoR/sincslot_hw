name: SincSlot Optimized CI/CD

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop

concurrency:
  group: sincslot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY_IMAGE: ghcr.io/al-dozor/sincslot-backend

jobs:
  lint_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Prettier
        working-directory: frontend
        run: npm exec prettier --check "src/**/*.{js,jsx,css}"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  lint_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies for pre-commit hooks
        working-directory: frontend
        run: npm ci

      - name: Run pre-commit
        run: pre-commit run --all-files

  test_backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_suite:
          - name: service
            path: backend/tests/test_service/test_service.py
          - name: settings_company
            path: backend/tests/test_company/test_settings_company/test_settings_company.py
          - name: work_schedule
            path: backend/tests/test_company/test_work_schedule/test_work_schedule.py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sincslot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sincslot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      SYNC_SLOT__DB__URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sincslot_ci
      SYNC_SLOT__DB_TEST__URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sincslot_ci
      SYNC_SLOT__DB__ECHO: 0
      SYNC_SLOT__DB__ECHO_POOL: 0
      SYNC_SLOT__PASSWORD__SALT: "Tom&Jerry"
      SYNC_SLOT__JWT__SECRET_KEY: secret_key
      SYNC_SLOT__JWT__ALGORITHM: HS256
      SYNC_SLOT__JWT__ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.test_suite.name }} tests
        run: pytest -q ${{ matrix.test_suite.path }}

  security_sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Bandit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit
        run: >
          bandit -q -ll -r
          backend/api
          backend/core
          backend/entity
          backend/repository
          backend/use_case
          -f json
          -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security_sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.65.0 \
            fs . \
            --scanners vuln \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

  security_gate:
    runs-on: ubuntu-latest
    needs:
      - security_sast
      - security_sca
    steps:
      - name: Check security status
        shell: bash
        run: |
          if [ "${{ needs.security_sast.result }}" != "success" ] || [ "${{ needs.security_sca.result }}" != "success" ]; then
            echo "Critical security findings detected."
            exit 1
          fi
          echo "Security gate passed."

  notify:
    runs-on: ubuntu-latest
    needs:
      - lint_frontend
      - lint_backend
      - test_backend
      - security_gate
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRONTEND_RESULT: ${{ needs.lint_frontend.result }}
          BACKEND_RESULT: ${{ needs.lint_backend.result }}
          TEST_RESULT: ${{ needs.test_backend.result }}
          SECURITY_RESULT: ${{ needs.security_gate.result }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          STATUS="FAILED"
          if [ "$FRONTEND_RESULT" = "success" ] && [ "$BACKEND_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] && [ "$SECURITY_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          fi

          MESSAGE="SincSlot CI: ${STATUS}%0APR: ${PR_TITLE}%0AAuthor: ${PR_AUTHOR}%0AFrontend lint: ${FRONTEND_RESULT}%0ABackend lint: ${BACKEND_RESULT}%0ATests: ${TEST_RESULT}%0ASecurity: ${SECURITY_RESULT}%0A${PR_URL}"

          curl -s --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}"

  build_backend_image:
    runs-on: ubuntu-latest
    needs:
      - lint_frontend
      - lint_backend
      - test_backend
      - security_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != ''
    steps:
      - name: Deploy to Docker host from Practice204
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sincslot
            docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
            docker compose pull app
            docker compose up -d app
